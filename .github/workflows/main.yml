name: Build Hamyar Portable

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔨 Build Portable EXE
        run: npx electron-builder --win portable --config.win.compression=maximum

      - name: 📤 Upload Portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: Hamyar-Portable
          path: dist/*.exe
          retention-days: 30
          if-no-files-found: error
